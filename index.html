<meta name="description" content="روابط نادي اقرأ للقرآن الكريم: الموقع، إنستجرام، فيسبوك وقناة واتساب">
<style>*,*::before,*::after{box-sizing:border-box}html{background:#07051f}body{margin:0;min-height:100vh}img{max-width:100%}</style>
<title>نادي اقرأ للقرآن الكريم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap">
<style>
  /* Layout: one narrow centered column for phones scanning a QR code; book mark and name on top, four stacked link rows below, the club website as the one filled gold row. */
  :root {
    --night: #07051f;
    --night-raised: #14113a;
    --gold: #e6bc55;
    --gold-soft: rgba(230, 188, 85, 0.32);
    --ink: #f4eedd;
    --mist: #b9b4d8;
    --font-display: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
    --font-body: "Tajawal", "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
    color-scheme: dark;
  }

  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    padding-inline: 20px;
    padding-block: 40px 32px;
  }

  .page {
    max-width: 440px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 32px;
    min-width: 0;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }

  .book {
    width: 190px;
    height: auto;
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 32px;
    border: 1px solid var(--gold-soft);
    display: block;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .bismillah {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--gold);
    margin: 0;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(30px, 9vw, 38px);
    line-height: 1.35;
    font-weight: 700;
    margin: 0;
    text-wrap: balance;
  }

  .lede {
    margin: 0;
    color: var(--mist);
    font-size: 15px;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
    padding: 14px 16px;
    border: 1px solid var(--gold-soft);
    border-radius: 14px;
    background: var(--night-raised);
    color: var(--ink);
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .link:hover { border-color: var(--gold); }
  .link:active { transform: scale(0.99); }
  .link:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .link.primary {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--night);
    padding-block: 18px;
  }

  .icon {
    flex: none;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--gold-soft);
    color: var(--gold);
  }

  .primary .icon {
    border-color: rgba(7, 5, 31, 0.35);
    color: var(--night);
  }

  .icon svg { width: 20px; height: 20px; }

  .text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .name { font-weight: 700; font-size: 17px; }

  .handle {
    font-size: 14px;
    color: var(--mist);
    overflow-wrap: anywhere;
  }

  .primary .handle { color: rgba(7, 5, 31, 0.78); }

  .go { flex: none; width: 18px; height: 18px; color: var(--gold); }
  .primary .go { color: var(--night); }

  footer {
    text-align: center;
    font-size: 13px;
    color: var(--mist);
  }

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
    .link:active { transform: none; }
  }
</style>
</head>
